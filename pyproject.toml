[project]
name = "omnimash-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cloudpickle>=3.1.2",
    "fastapi>=0.141.1",
    "ffmpeg-python>=0.2.0",
    "google-adk>=2.9.2",
    "google-cloud-aiplatform>=2.3.0",
    "google-cloud-storage>=3.16.0",
    "google-genai>=2.27.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sse-starlette>=3.4.11",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.8.19",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
deprecated = "ignore"
