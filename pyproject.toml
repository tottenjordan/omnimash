[project]
name = "omnimash-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cloudpickle>=3.1.2",
    "fastapi>=0.162.0",
    "google-adk>=2.14.1",
    "google-cloud-aiplatform>=2.9.0",
    "google-cloud-storage>=3.17.1",
    "google-genai>=2.34.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sse-starlette>=3.6.0",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.10.21",
    "pillow>=13.0.0",
    "google-cloud-modelarmor>=0.7.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
    "ty>=0.0.98",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-n auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "browser: marks tests requiring headless browser via Playwright (deselect with '-m \"not browser\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.rules]
deprecated = "ignore"
