<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniMash • Digital Director's Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.tailwind = window.tailwind || {};
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg-primary: #030712;
            --bg-surface: #0d121f;
            --bg-elevated: #111827;
            --text-primary: #f9fafb;
            --text-secondary: #d1d5db;
            --text-muted: #9ca3af;
            --accent-primary: #4f46e5;
            --accent-secondary: #2563eb;
            --focus-ring: #6366f1;
            --border-subtle: rgba(255, 255, 255, 0.08);
        }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-primary); color: var(--text-primary); }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0b0f19; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #374151; }
        .studio-glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .studio-panel { background: var(--bg-surface); border: 1px solid var(--border-subtle); }
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [role="button"]:focus-visible {
            outline: 2px solid var(--focus-ring);
            outline-offset: 2px;
        }
        input::placeholder, textarea::placeholder {
            color: var(--text-muted);
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans antialiased min-h-screen selection:bg-blue-600 selection:text-white">
    <div id="__next"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const getDisplayableRefUrl = (url) => {
            if (!url) return "";
            const clean = String(url).trim();
            if (clean.startsWith("gs://") || clean.startsWith("https://storage.googleapis.com/") || clean.startsWith("https://storage.cloud.google.com/")) {
                return `/api/media-proxy?uri=${encodeURIComponent(clean)}`;
            }
            return clean;
        };

        const getNextAvailableRoleId = (charList) => {
            const used = new Set((charList || []).map(c => c && c.role_id).filter(Boolean));
            for (let i = 0; i < 26; i++) {
                const candidate = `Role ${String.fromCharCode(65 + i)}`;
                if (!used.has(candidate)) return candidate;
            }
            return `Role ${(charList || []).length + 1}`;
        };

        const exampleConcepts = [
            "Fiery Executive Chef vs Classic French Pastry Master in a cyberpunk iron chef battle",
            "Spectacled Wizard Bruv vs Platinum Rival Blood rap battle in 2000s Atlanta trap style",
            "Gothic Potion Master in a 90s East Coast boom-bap rap video",
            "Cyborg Ninja vs Neon Samurai in an arcade showdown"
        ];

        const GUIDED_DIFF_CATEGORY_PILLS = [
            {
                label: "🌧️ Lighting/Weather",
                template: "Shift scene lighting to dramatic neon rain with volumetric fog reflections. Keep everything else the same."
            },
            {
                label: "🎥 Camera Angle",
                template: "Change camera framing to a dynamic low-angle dolly push-in on the primary subject. Keep everything else the same."
            },
            {
                label: "🎵 Audio Beat",
                template: "Swap background audio to an instrumental 140 BPM heavy 808 trap beat ducked under dialogue. Keep everything else the same."
            },
            {
                label: "🗣️ Dialogue Line",
                template: "Update spoken dialogue delivery to an energetic, confident cadence with clear lip-sync. Keep everything else the same."
            },
            {
                label: "⏱️ Pacing",
                template: "Increase action pacing by 30% with crisp motion transitions. Keep everything else the same."
            }
        ];

        function ToastNotificationRegion({ toasts = [], onDismiss }) {
            return (
                <div
                    role="status"
                    aria-live="polite"
                    aria-atomic="false"
                    className="ToastNotificationRegion fixed bottom-5 right-5 z-[100] flex flex-col gap-2.5 max-w-md w-full pointer-events-none"
                >
                    {toasts.slice(-4).map((toast) => {
                        const toneClasses = toast.type === "error"
                            ? "bg-red-950/95 border-red-500/80 text-red-100"
                            : toast.type === "success"
                            ? "bg-emerald-950/95 border-emerald-500/80 text-emerald-100"
                            : toast.type === "warning"
                            ? "bg-amber-950/95 border-amber-500/80 text-amber-100"
                            : "bg-indigo-950/95 border-indigo-500/80 text-indigo-100";
                        const icon = toast.type === "error"
                            ? "🚨"
                            : toast.type === "success"
                            ? "✅"
                            : toast.type === "warning"
                            ? "⚠️"
                            : "ℹ️";
                        return (
                            <div
                                key={toast.id}
                                className={`pointer-events-auto flex items-start justify-between gap-3 px-4 py-3 rounded-xl border shadow-2xl backdrop-blur-md transition-all ${toneClasses}`}
                            >
                                <div className="flex items-start gap-2.5 text-xs leading-relaxed">
                                    <span aria-hidden="true" className="text-sm">{icon}</span>
                                    <span className="font-medium break-words">{toast.message}</span>
                                </div>
                                <button
                                    type="button"
                                    onClick={() => onDismiss && onDismiss(toast.id)}
                                    aria-label="Dismiss notification"
                                    className="text-xs text-gray-300 hover:text-white px-1.5 py-0.5 rounded bg-black/30 hover:bg-black/50 transition shrink-0"
                                >
                                    ✕
                                </button>
                            </div>
                        );
                    })}
                </div>
            );
        }

        function CharacterRosterAndTurnaroundStudio({
            characters = [],
            savedVaultCharacters = [],
            savedVaultReferenceSheets = [],
            charTagInputs = {},
            setCharTagInputs,
            charSheetDrawerOpen = {},
            charSheetModel = {},
            setCharSheetModel,
            charSheetAspectRatio = {},
            setCharSheetAspectRatio,
            charSheetPrompt = {},
            setCharSheetPrompt,
            charSheetFileName = {},
            setCharSheetFileName,
            charSheetGenerating = {},
            charSheetSaving = {},
            charSheetPreview = {},
            stageStyleTone = "",
            setLightboxImageUrl,
            handleSaveSessionRoster,
            handleLoadSessionRoster,
            handleAutoStyleAllCharacters,
            handleResetRoster,
            addCharacterRole,
            handleLoadVaultCharacter,
            updateCharacter,
            handleSaveCharacterToVault,
            removeCharacter,
            addCharAestheticTag,
            removeCharAestheticTag,
            handleDetachReferenceUrl,
            handleToggleCharSheetDrawer,
            getDefaultTurnaroundPrompt,
            handleGenerateCharSheet,
            handleAutoStyleCharacter,
            handleSaveCharSheet
        }) {
            return (
                <div className="border-gray-800 bg-gray-900/80 backdrop-blur p-5 rounded-2xl shadow-xl space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <h3 className="text-xs font-bold text-purple-400 uppercase tracking-wider flex items-center gap-2 border-l-4 border-indigo-500 pl-3">
                                <span>👥</span>
                                <span>Character Roles &amp; Character Vault (Gemini Omni Image Roles)</span>
                            </h3>
                            <p className="text-[11px] text-gray-400 mt-0.5">
                                Define character roles with visual descriptions, voice style profiles, off-screen narrator flags, and attached reference image URLs to maintain likeness.
                            </p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                            <button
                                type="button"
                                onClick={handleSaveSessionRoster}
                                className="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 text-xs py-2 px-3 rounded-xl flex items-center gap-1.5 transition shadow-sm"
                                title="Save current cast roster to session"
                            >
                                <span>💾</span>
                                <span>Save Cast Roster</span>
                            </button>
                            <button
                                type="button"
                                onClick={handleLoadSessionRoster}
                                className="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 text-xs py-2 px-3 rounded-xl flex items-center gap-1.5 transition shadow-sm"
                                title="Restore saved cast roster for this session"
                            >
                                <span>📂</span>
                                <span>Restore Cast</span>
                            </button>
                            <button
                                type="button"
                                onClick={handleAutoStyleAllCharacters}
                                className="bg-purple-950/80 hover:bg-purple-900 border border-purple-700 text-purple-200 text-xs py-2 px-3 rounded-xl flex items-center gap-1.5 transition shadow-sm font-bold"
                                title="Auto-style all character reference photos to match active preset"
                            >
                                <span>🎨</span>
                                <span>Auto-Style All Characters</span>
                            </button>
                            <button
                                type="button"
                                onClick={handleResetRoster}
                                className="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 text-xs py-2 px-3 rounded-xl flex items-center gap-1.5 transition shadow-sm"
                                title="Clear all characters from current roster"
                            >
                                <span>🧹</span>
                                <span>Reset Roster</span>
                            </button>
                            <button
                                type="button"
                                onClick={addCharacterRole}
                                className="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 text-xs py-2 px-3 rounded-xl flex items-center gap-1.5 transition shadow-sm"
                            >
                                <span>+ Add Character Role</span>
                            </button>
                        </div>
                    </div>

                    {/* 🏛️ Character Vault & Saved Library */}
                    <div className="bg-gray-950/80 border border-purple-900/50 rounded-xl p-3.5 space-y-2.5">
                        <div className="flex items-center justify-between">
                            <label className="text-xs font-bold text-purple-300 uppercase tracking-wider flex items-center gap-2">
                                <span>🏛️</span>
                                <span>Character Vault &amp; Saved Library</span>
                            </label>
                            <span className="text-xs text-gray-400 font-mono">
                                {savedVaultCharacters.length} Preset(s) Available
                            </span>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            {savedVaultCharacters.map((c, vIdx) => {
                                const chipText = c.name || c.role_id || `Preset ${vIdx + 1}`;
                                return (
                                    <button
                                        key={vIdx}
                                        type="button"
                                        onClick={() => handleLoadVaultCharacter(c)}
                                        className="bg-purple-950/70 hover:bg-purple-900 text-purple-200 border border-purple-800/80 hover:border-purple-500 text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition shadow-sm"
                                        title={`Click to load ${c.name || c.role_id} into roster`}
                                    >
                                        {c.reference_url && (
                                            <img
                                                src={getDisplayableRefUrl(c.reference_url)}
                                                alt={c.name || "Preset"}
                                                className="w-4 h-4 rounded-full object-cover border border-purple-400/50"
                                            />
                                        )}
                                        <span>+</span>
                                        <span>{chipText}</span>
                                    </button>
                                );
                            })}
                            {savedVaultCharacters.length === 0 && (
                                <span className="text-xs text-gray-300 italic py-1">
                                    No characters in vault yet. Save character roles below to build your library.
                                </span>
                            )}
                        </div>
                        {savedVaultReferenceSheets.length > 0 && (
                            <div className="pt-3 border-t border-purple-900/40 space-y-2">
                                <div className="flex items-center justify-between">
                                    <label className="text-[11px] font-bold text-pink-300 uppercase tracking-wider flex items-center gap-1.5">
                                        <span>🖼️</span>
                                        <span>Saved Character Turnaround Sheets</span>
                                    </label>
                                    <span className="text-xs text-gray-400 font-mono">
                                        {savedVaultReferenceSheets.length} Sheet(s)
                                    </span>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
                                    {savedVaultReferenceSheets.map((sheet, sIdx) => (
                                        <div key={sIdx} className="bg-gray-900 border border-purple-900/60 rounded-lg p-2 flex flex-col gap-1.5">
                                            <div className="flex items-center gap-2">
                                                <img
                                                    src={getDisplayableRefUrl(sheet.url)}
                                                    alt={sheet.name || sheet.filename}
                                                    onClick={() => setLightboxImageUrl(getDisplayableRefUrl(sheet.url))}
                                                    className="w-12 h-12 object-cover rounded border border-purple-500/50 cursor-pointer hover:opacity-80 transition"
                                                    title="Click to zoom preview"
                                                />
                                                <div className="min-w-0 flex-1">
                                                    <span className="text-xs font-bold text-purple-200 block truncate" title={sheet.name || sheet.filename}>
                                                        {sheet.name || sheet.filename}
                                                    </span>
                                                    <button
                                                        type="button"
                                                        onClick={() => setLightboxImageUrl(getDisplayableRefUrl(sheet.url))}
                                                        className="text-xs text-amber-300 hover:text-amber-200 font-bold block"
                                                    >
                                                        🔍 Zoom
                                                    </button>
                                                </div>
                                            </div>
                                            <select
                                                onChange={(e) => {
                                                    if (e.target.value !== "") {
                                                        updateCharacter(parseInt(e.target.value, 10), "reference_url", sheet.url);
                                                        e.target.value = "";
                                                    }
                                                }}
                                                defaultValue=""
                                                className="w-full bg-gray-950 border border-purple-900/60 rounded p-1 text-[11px] text-purple-200 font-mono"
                                            >
                                                <option value="" disabled>➕ Apply to Character...</option>
                                                {characters.map((c, cIdx) => (
                                                    <option key={cIdx} value={cIdx}>
                                                        {c.name || c.role_id || `Character ${cIdx + 1}`}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {characters.map((char, idx) => (
                            <div key={idx} className="bg-gray-950 border border-gray-800/90 rounded-xl p-4 space-y-3 relative group">
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                    <div className="flex flex-wrap items-center gap-2">
                                        <span className="text-xs font-bold font-mono bg-pink-950 text-pink-300 px-2.5 py-1 rounded border border-pink-800/80">
                                            Character {idx + 1}: {char.name || char.role_id}
                                        </span>
                                        {char.reference_url && (
                                            <span className="text-xs font-bold font-mono bg-emerald-950/90 text-emerald-300 px-2 py-0.5 rounded border border-emerald-700/80 flex items-center gap-1">
                                                <span>⚓ Visual Anchor Active</span>
                                            </span>
                                        )}
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <button
                                            type="button"
                                            onClick={() => handleSaveCharacterToVault(char)}
                                            className="bg-gray-900 hover:bg-purple-950 text-purple-300 hover:text-purple-200 border border-purple-900/60 hover:border-purple-700 text-xs px-2.5 py-1 rounded-lg transition flex items-center gap-1.5 shadow-sm font-medium"
                                            title="Save character to vault library"
                                        >
                                            <span>💾</span>
                                            <span>Save to Vault</span>
                                        </button>
                                        {characters.length > 1 && (
                                            <button
                                                type="button"
                                                onClick={() => removeCharacter(idx)}
                                                className="text-gray-300 hover:text-red-400 text-xs px-2 py-1 transition"
                                                title="Remove Character Role"
                                            >
                                                🗑️ Remove
                                            </button>
                                        )}
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-[11px] text-gray-400 mb-1">Character Name</label>
                                    <input
                                        type="text"
                                        value={char.name || ""}
                                        onChange={(e) => updateCharacter(idx, "name", e.target.value)}
                                        placeholder="e.g. Spectacled Wizard Bruv"
                                        className="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-purple-500 font-medium"
                                    />
                                </div>
                                <div>
                                    <label className="block text-[11px] text-gray-400 mb-1">Visual Likeness &amp; Description</label>
                                    <textarea
                                        rows={2}
                                        value={char.description || ""}
                                        onChange={(e) => updateCharacter(idx, "description", e.target.value)}
                                        placeholder="Visual description for prompt compiler..."
                                        className="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-purple-500 font-mono text-[11px]"
                                    />
                                </div>

                                {/* Character Style Signifiers (Aesthetic Tags) Chip Manager */}
                                <div>
                                    <label className="block text-[11px] font-bold text-pink-400 uppercase tracking-wider mb-1">
                                        👔 Wardrobe &amp; Aesthetic Style Signifiers
                                    </label>
                                    <div className="flex flex-wrap gap-1.5 mb-2">
                                        {(char.aesthetic_tags || []).map((tag, tIdx) => (
                                            <span
                                                key={tIdx}
                                                className="bg-purple-950/70 border border-purple-800/80 text-purple-200 text-xs px-2.5 py-0.5 rounded-lg flex items-center gap-1.5"
                                            >
                                                <span>{tag}</span>
                                                <button
                                                    type="button"
                                                    onClick={() => removeCharAestheticTag(idx, tag)}
                                                    className="text-purple-400 hover:text-white font-bold text-xs"
                                                    title="Remove Style Tag"
                                                >
                                                    ×
                                                </button>
                                            </span>
                                        ))}
                                        {(!char.aesthetic_tags || char.aesthetic_tags.length === 0) && (
                                            <span className="text-xs text-gray-300 italic">No specific character style tags</span>
                                        )}
                                    </div>
                                    <div className="flex gap-1.5">
                                        <input
                                            type="text"
                                            value={charTagInputs[idx] || ""}
                                            onChange={(e) => setCharTagInputs({ ...charTagInputs, [idx]: e.target.value })}
                                            onKeyDown={(e) => {
                                                if (e.key === "Enter") {
                                                    e.preventDefault();
                                                    addCharAestheticTag(idx);
                                                }
                                            }}
                                            placeholder="e.g. Crimson Velvet Tracksuit, Gold Wire-Rim Glasses..."
                                            className="flex-1 bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-white placeholder-gray-400 focus:outline-none focus:border-purple-500 font-mono"
                                        />
                                        <button
                                            type="button"
                                            onClick={() => addCharAestheticTag(idx)}
                                            className="bg-purple-900/60 hover:bg-purple-800 text-purple-200 border border-purple-700 font-bold text-xs px-3 py-1.5 rounded-lg shadow transition"
                                        >
                                            + Add Style
                                        </button>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-[11px] text-gray-400 mb-1">
                                        🎙️ Voice Profile / Vocal Style
                                    </label>
                                    <input
                                        type="text"
                                        value={char.voice_style || char.voice_profile || ""}
                                        onChange={(e) => {
                                            const val = e.target.value;
                                            updateCharacter(idx, "voice_style", val);
                                            updateCharacter(idx, "voice_profile", val);
                                        }}
                                        placeholder="e.g. Deep raspy baritone voice with fast rap cadence..."
                                        className="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-purple-500 font-mono text-[11px]"
                                    />
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                                    <div>
                                        <label className="block text-[11px] font-bold text-purple-300 uppercase tracking-wider mb-1">
                                            🖼️ Gemini Image Role
                                        </label>
                                        <select
                                            value={char.image_role || "Character Reference"}
                                            onChange={(e) => updateCharacter(idx, "image_role", e.target.value)}
                                            className="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-purple-200 focus:outline-none focus:border-purple-500 font-mono"
                                        >
                                            <option value="Character Reference">Character Reference</option>
                                            <option value="Product Reference">Product Reference</option>
                                            <option value="Starting Frame">Starting Frame</option>
                                            <option value="Style Reference">Style Reference</option>
                                        </select>
                                    </div>
                                    <div className="flex items-end pb-1">
                                        <label className="flex items-center space-x-2 cursor-pointer text-[11px] text-gray-300 bg-gray-900 border border-gray-800 hover:border-amber-500/50 p-2 rounded-lg w-full transition">
                                            <input
                                                type="checkbox"
                                                checked={!!char.is_offscreen_narrator}
                                                onChange={(e) => updateCharacter(idx, "is_offscreen_narrator", e.target.checked)}
                                                className="rounded border-gray-700 text-amber-500 focus:ring-amber-500 bg-gray-950 w-4 h-4"
                                            />
                                            <span className="font-bold text-amber-300">🎙️ Off-Screen Narrator</span>
                                        </label>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-[11px] text-gray-400 mb-1">
                                        🖼️ Reference Image URL <span className="text-purple-400 text-xs">(Gemini Omni Image Role)</span>
                                    </label>
                                    <div className="flex items-center gap-2">
                                        <input
                                            type="text"
                                            value={char.reference_url || ""}
                                            onChange={(e) => updateCharacter(idx, "reference_url", e.target.value)}
                                            placeholder="https://example.com/character_reference.jpg"
                                            className="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-purple-500 font-mono text-[11px]"
                                        />
                                        {char.reference_url && (
                                            <button
                                                type="button"
                                                onClick={() => handleDetachReferenceUrl(idx)}
                                                className="bg-red-950/60 hover:bg-red-900/80 text-red-300 border border-red-800/60 font-bold text-xs px-2.5 py-2 rounded-lg transition whitespace-nowrap"
                                                title="Detach Reference Image"
                                            >
                                                ❌ Detach Reference Image
                                            </button>
                                        )}
                                    </div>
                                    {savedVaultReferenceSheets.length > 0 && (
                                        <div className="mt-1.5">
                                            <select
                                                onChange={(e) => {
                                                    if (e.target.value) updateCharacter(idx, "reference_url", e.target.value);
                                                }}
                                                defaultValue=""
                                                className="w-full bg-gray-950 border border-purple-900/60 rounded-lg p-2 text-xs text-purple-200 font-mono"
                                            >
                                                <option value="" disabled>🖼️ Select from Saved Turnaround Sheets...</option>
                                                {savedVaultReferenceSheets.map((sheet, sIdx) => (
                                                    <option key={sIdx} value={sheet.url}>
                                                        {sheet.name || sheet.filename}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                    )}
                                    {char.reference_url && (
                                        <div
                                            onClick={() => setLightboxImageUrl(getDisplayableRefUrl(char.reference_url))}

                        setMode4VideoUrl(data.video_url);
                        setCurrentVideo(data.video_url);
                        addToast("🎬 Mode 4 Direct Video Render Complete!", "success");

                                                <div className="aspect-video bg-black rounded-xl overflow-hidden border border-gray-800 max-w-2xl mx-auto">
                                                    <video src={getDisplayableRefUrl(j3MasterVideoUrl)} controls className="w-full h-full object-contain" />
                                                </div>
                                            </div>
                                        )}

                                        <div className="flex justify-end gap-3">
                                            {j3MasterVideoUrl && (
                                                <button
                                                    type="button"
                                                    onClick={() => handleOpenShareModal(j3MasterVideoUrl, "mode3_stitched_master")}
                                                    className="text-xs bg-indigo-950/80 hover:bg-indigo-900 text-indigo-300 border border-indigo-700/80 font-bold py-3 px-5 rounded-xl shadow-lg flex items-center gap-2 transition"
                                                    title="Create 7-day link accessible to anyone without exposing main app"
                                                >
                                                    <span>🔗</span>
                                                    <span>Share Video (7 Days)</span>
                                                </button>
                                            )}
                                            <button
                                                type="button"
                                                disabled={j3StitchLoading}
                                                onClick={handleJourney3Stitch}
                                                className="bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 hover:from-pink-400 hover:to-indigo-500 text-white font-extrabold text-xs py-3 px-6 rounded-xl shadow-lg flex items-center gap-2 disabled:opacity-50"
                                            >
                                                <span>🎬</span>
                                                <span>{j3StitchLoading ? "Stitching Master Video..." : "🎬 Stitch Master Video"}</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                </div>
                                )}
                            </div>
                        )}

                        {/* Fullscreen Lightbox Modal */}
                        {lightboxImageUrl && (
                            <div
                                role="dialog"
                                aria-modal="true"
                                aria-labelledby="modal-title-lightbox"
                                className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4"
                                onClick={() => setLightboxImageUrl(null)}
                            >
                                <div className="relative max-w-5xl max-h-[90vh] flex flex-col items-center justify-center" onClick={(e) => e.stopPropagation()}>
                                    <h3 id="modal-title-lightbox" className="sr-only">Enlarged Visual Preview</h3>
                                    <button
                                        type="button"
                                        onClick={() => setLightboxImageUrl(null)}
                                        aria-label="Close Fullscreen Lightbox"
                                        className="absolute -top-10 right-0 text-white hover:text-red-400 text-sm font-bold bg-gray-900 border border-gray-700 px-3 py-1 rounded-full transition shadow-lg"
                                    >
                                        ✕ Close Fullscreen
                                    </button>
                                    <img
                                        src={lightboxImageUrl}
                                        alt="Enlarged Visual Preview"
                                        className="max-w-full max-h-[85vh] object-contain rounded-2xl border border-gray-700 shadow-2xl"
                                    />
                                </div>
                            </div>
                        )}

                        {/* Director's Co-Pilot Gap Filler & Assistant Modal */}
                        {showIntentAssistModal && (
                            <div
                                role="dialog"
                                aria-modal="true"
                                aria-labelledby="modal-title-intent-assist"
                                className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"
                                onClick={() => setShowIntentAssistModal(false)}
                            >
                                <div
                                    className="bg-gray-900 border border-cyan-500/60 rounded-3xl p-6 max-w-3xl w-full shadow-2xl space-y-4 max-h-[85vh] flex flex-col"
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    <div className="flex items-center justify-between border-b border-gray-800 pb-3">
                                        <div className="flex items-center gap-2">
                                            <span className="text-xl">✨</span>
                                            <h3 id="modal-title-intent-assist" className="text-base font-extrabold text-cyan-300">
                                                Director's Co-Pilot Gap Filler &amp; Assistant
                                            </h3>
                                        </div>
                                        <button
                                            type="button"
                                            onClick={() => setShowIntentAssistModal(false)}
                                            aria-label="Close intent assist modal"
                                            className="text-gray-300 hover:text-white text-lg font-black px-2 py-1"
                                        >
                                            ✕
                                        </button>
                                    </div>

                                    <div className="flex-1 overflow-y-auto space-y-4 pr-1 custom-scrollbar">
                                        <div className="bg-cyan-950/40 border border-cyan-800/60 rounded-xl p-3 text-xs text-cyan-200">
                                            <span className="font-bold text-cyan-300">Targeting: </span>
                                            {intentAssistTargetMode === "stages"
                                                ? "Mode 1: Guided Fine-Tune"
                                                : intentAssistTargetMode === "acts"
                                                ? "Mode 2: Screenplay Storyboard"
                                                : "Mode 3: Continuity Studio"}
                                            <p className="text-[11px] text-gray-400 mt-1">
                                                Clarify missing directorial slots or auto-fill a cohesive plan. Applied results immediately populate this mode's state.
                                            </p>
                                        </div>

                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-gray-300 block">
                                                Premise / Creative Concept:
                                            </label>
                                            <textarea
                                                rows={3}
                                                value={intentText}
                                                onChange={(e) => setIntentText(e.target.value)}
                                                placeholder="Describe what you want to direct..."
                                                className="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-cyan-500 font-mono"
                                            />
                                        </div>

                                        {/* Compact Character Vault Dropdown + Dialogue Direction in Assist Modal */}
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-gray-950/70 border border-gray-800/80 rounded-xl p-3">
                                            <div className="space-y-1.5 relative">
                                                <label className="text-[11px] font-bold text-amber-300 block">
                                                    🏛️ Saved Character Vault (with Thumbnail):
                                                </label>
                                                <button
                                                    type="button"
                                                    onClick={() => setShowAssistVaultDropdown(prev => !prev)}
                                                    className="w-full flex items-center justify-between gap-2 bg-gray-900 hover:bg-gray-800 border border-amber-700/60 rounded-lg px-2.5 py-2 text-left transition"
                                                >
                                                    <div className="flex items-center gap-1.5 min-w-0">
                                                        {Array.isArray(intentInputs.character_profiles) && intentInputs.character_profiles.length > 0 ? (
                                                            <div className="flex items-center -space-x-1.5 shrink-0">
                                                                {intentInputs.character_profiles.slice(0, 3).map((prof, idx) => (
                                                                    prof.reference_url ? (
                                                                        <img
                                                                            key={idx}
                                                                            src={getDisplayableRefUrl(prof.reference_url)}
                                                                            alt={prof.name}
                                                                            className="w-5 h-5 rounded-full object-cover border border-amber-400 bg-gray-950"
                                                                        />
                                                                    ) : (
                                                                        <span key={idx} className="w-5 h-5 rounded-full bg-amber-950 border border-amber-500 text-xs font-bold text-amber-300 flex items-center justify-center">
                                                                            {(prof.name || "C")[0]}
                                                                        </span>
                                                                    )
                                                                ))}
                                                            </div>
                                                        ) : (
                                                            <span className="text-xs">🎭</span>
                                                        )}
                                                        <span className="text-[11px] font-bold text-amber-100 truncate">
                                                            {Array.isArray(intentInputs.character_profiles) && intentInputs.character_profiles.length > 0
                                                                ? intentInputs.character_profiles.map(p => p.name).join(", ")
                                                                : "Select Saved Character(s)..."}
                                                        </span>
                                                    </div>
                                                    <span className="text-xs text-amber-300 shrink-0">{showAssistVaultDropdown ? "▲" : "▼"}</span>
                                                </button>
                                                {showAssistVaultDropdown && (
                                                    <div className="mt-1 bg-gray-900 border border-amber-600/80 rounded-lg p-2 space-y-1.5 max-h-48 overflow-y-auto shadow-xl">
                                                        {availableVaultLibraryCharacters.map((vaultChar, vIdx) => {
                                                            const isSelected = (intentInputs.character_profiles || []).some(
                                                                (p) => (p.name || "").toLowerCase() === (vaultChar.name || "").toLowerCase()
                                                            );
                                                            const thumbUrl = getDisplayableRefUrl(vaultChar.reference_url);
                                                            return (
                                                                <div
                                                                    key={`${vaultChar.name}-${vIdx}`}
                                                                    onClick={() => handleToggleMode4VaultCharacter(vaultChar)}
                                                                    className={`flex items-center gap-2 p-1.5 rounded-lg border cursor-pointer transition ${
                                                                        isSelected
                                                                            ? "bg-amber-950/60 border-amber-400"
                                                                            : "bg-gray-950/80 border-gray-800 hover:border-amber-700/60"
                                                                    }`}
                                                                >
                                                                    <input
                                                                        type="checkbox"
                                                                        checked={isSelected}
                                                                        onChange={() => {}}
                                                                        className="w-3.5 h-3.5 accent-amber-500 rounded pointer-events-none"
                                                                    />
                                                                    {thumbUrl ? (
                                                                        <img
                                                                            src={thumbUrl}
                                                                            alt={vaultChar.name}
                                                                            className="w-8 h-8 rounded object-cover border border-amber-500/60 shrink-0 bg-black"
                                                                        />
                                                                    ) : (
                                                                        <div className="w-8 h-8 rounded bg-gray-800 flex items-center justify-center text-xs shrink-0">🎭</div>
                                                                    )}
                                                                    <div className="min-w-0 flex-1">
                                                                        <div className="text-[11px] font-bold text-white truncate">{vaultChar.name}</div>
                                                                        <div className="text-xs text-gray-400 truncate">{vaultChar.wardrobe || vaultChar.voice_style || "Character Vault Anchor"}</div>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                )}
                                            </div>

                                            <div className="space-y-1.5">
                                                <label className="text-[11px] font-bold text-emerald-300 block">
                                                    🗣️ Dialogue Direction (Guidance for Gemini):
                                                </label>
                                                <input
                                                    type="text"
                                                    value={intentInputs.dialogue_direction || ""}
                                                    onChange={(e) => setIntentInputs({ ...intentInputs, dialogue_direction: e.target.value })}
                                                    placeholder="e.g., passive-aggressive audit banter, rhyming disses..."
                                                    className="w-full bg-gray-900 border border-emerald-700/60 rounded-lg px-2.5 py-2 text-[11px] text-white placeholder-gray-500 focus:outline-none focus:border-emerald-400"
                                                />
                                            </div>
                                        </div>

                                        {/* Dual Action Buttons in Modal */}
                                        <div className="flex flex-wrap items-center justify-end gap-2.5">
                                            <button
                                                type="button"
                                                disabled={intentLoading || !intentText.trim()}
                                                onClick={() => handleAnalyzeIntentGaps()}
                                                className="bg-cyan-950/80 hover:bg-cyan-900 border border-cyan-600/70 text-cyan-200 font-bold text-xs py-2 px-3.5 rounded-xl shadow transition disabled:opacity-50"
                                            >
                                                <span>❓</span>
                                                <span>{intentLoading ? "Analyzing..." : "Ask Me Questions (Clarify Gaps)"}</span>
                                            </button>
                                            <button
                                                type="button"
                                                disabled={intentLoading || !intentText.trim()}
                                                onClick={() => handleAutoFillIntentPlan()}
                                                className="bg-gradient-to-r from-cyan-600 to-teal-600 hover:from-cyan-500 text-white font-bold text-xs py-2 px-4 rounded-xl shadow transition disabled:opacity-50"
                                            >
                                                <span>🎲</span>
                                                <span>{intentLoading ? "Synthesizing..." : "Surprise Me (Auto-Fill Gaps Cohesively)"}</span>
                                            </button>
                                        </div>

                                        {/* Questions Flow in Modal */}
                                        {intentQuestions && intentQuestions.length > 0 && !compiledIntentPlan && (
                                            <div className="border border-cyan-800/60 bg-gray-950/80 p-4 rounded-xl space-y-3">
                                                <div className="flex items-center justify-between text-xs font-bold text-cyan-300">
                                                    <span>Question {currentQuestionIdx + 1} of {intentQuestions.length}</span>
                                                    <span className="font-mono text-[11px] text-gray-400">{intentQuestions[currentQuestionIdx]?.slot_target}</span>
                                                </div>
                                                <h4 className="text-xs font-semibold text-white">
                                                    {intentQuestions[currentQuestionIdx]?.title}
                                                </h4>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                    {intentQuestions[currentQuestionIdx]?.options && intentQuestions[currentQuestionIdx]?.options.map((opt) => {
                                                        const qId = intentQuestions[currentQuestionIdx].question_id;
                                                        const isSelected = questionAnswers[qId] === opt.label || questionAnswers[qId] === opt.id;
                                                        return (
                                                            <button
                                                                key={opt.id}
                                                                type="button"
                                                                onClick={() => setQuestionAnswers({ ...questionAnswers, [qId]: opt.label })}
                                                                className={`text-left p-2.5 rounded-lg border text-xs transition ${
                                                                    isSelected
                                                                        ? "border-cyan-400 bg-cyan-950 text-cyan-200 font-bold"
                                                                        : "border-gray-800 bg-gray-900 text-gray-300"
                                                                }`}
                                                            >
                                                                {opt.label}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                                <div className="flex items-center justify-between pt-2">
                                                    <button
                                                        type="button"
                                                        disabled={currentQuestionIdx === 0}
                                                        onClick={() => setCurrentQuestionIdx(prev => Math.max(0, prev - 1))}
                                                        className="bg-gray-800 text-gray-300 text-xs px-3 py-1 rounded-lg disabled:opacity-40"
                                                    >
                                                        ← Back
                                                    </button>
                                                    <div className="flex gap-2">
                                                        <button
                                                            type="button"
                                                            disabled={intentLoading}
                                                            onClick={() => handleAutoFillIntentPlan()}
                                                            className="bg-cyan-950 text-cyan-300 border border-cyan-700 text-xs px-3 py-1 rounded-lg"
                                                        >
                                                            Auto-Fill Remainder
                                                        </button>
                                                        {currentQuestionIdx < intentQuestions.length - 1 ? (
                                                            <button
                                                                type="button"
                                                                onClick={() => setCurrentQuestionIdx(prev => prev + 1)}
                                                                className="bg-cyan-600 text-white text-xs px-3 py-1 rounded-lg font-bold"
                                                            >
                                                                Next →
                                                            </button>
                                                        ) : (
                                                            <button
                                                                type="button"
                                                                disabled={intentLoading}
                                                                onClick={() => handleAutoFillIntentPlan()}
                                                                className="bg-cyan-600 text-white text-xs px-3 py-1 rounded-lg font-bold"
                                                            >
                                                                Finish &amp; Synthesize →
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {/* Synthesized Plan Summary in Modal */}
                                        {compiledIntentPlan && (
                                            <div className="border border-cyan-800/80 bg-gray-950/90 p-4 rounded-xl space-y-3">
                                                <div className="flex items-center gap-2 text-cyan-400 font-bold text-xs">
                                                    <span>✓</span>
                                                    <span>Plan Synthesized</span>
                                                </div>
                                                <div className="text-xs space-y-1.5 text-gray-300">
                                                    <p><strong className="text-cyan-300">Cast:</strong> {Array.isArray(compiledIntentPlan.characters) ? compiledIntentPlan.characters.map(c => typeof c === "string" ? c : c.name).join(", ") : "Cast configured"}</p>
                                                    <p><strong className="text-cyan-300">Setting:</strong> {compiledIntentPlan.environment || "Configured"}</p>
                                                    <p><strong className="text-cyan-300">Style:</strong> {compiledIntentPlan.style_tone || "Configured"}</p>
                                                    <p><strong className="text-cyan-300">Beat:</strong> {compiledIntentPlan.audio_beat || "Configured"}</p>
                                                    {compiledIntentPlan.dialogue_direction && (
                                                        <p><strong className="text-emerald-300">Dialogue Direction:</strong> {compiledIntentPlan.dialogue_direction}</p>
                                                    )}
                                                </div>
                                                <div className="pt-2">
                                                    <button
                                                        type="button"
                                                        onClick={handleApplyIntentAssistToTarget}
                                                        className="w-full bg-gradient-to-r from-cyan-600 to-teal-600 hover:from-cyan-500 text-white font-extrabold text-xs py-2.5 px-4 rounded-xl shadow-lg transition"
                                                    >
                                                        Apply to {intentAssistTargetMode === "stages" ? "Mode 1 (Guided Fine-Tune)" : intentAssistTargetMode === "acts" ? "Mode 2 (Screenplay Storyboard)" : "Mode 3 (Continuity Studio)"}
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div className="flex items-center justify-end border-t border-gray-800 pt-3">
                                        <button
                                            type="button"
                                            onClick={() => setShowIntentAssistModal(false)}
                                            className="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-bold px-4 py-2 rounded-xl transition"
                                        >
                                            Close
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        class GlobalErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("UI Rendering Error Caught:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-gray-950 text-white p-8 flex flex-col items-center justify-center">
                            <div className="max-w-2xl w-full bg-gray-900 border border-red-800 rounded-3xl p-8 shadow-2xl space-y-6 text-center">
                                <span className="text-5xl block">⚠️</span>
                                <h1 className="text-2xl font-black text-red-400">UI Rendering Error Caught</h1>
                                <p className="text-sm text-gray-300">
                                    A rendering exception occurred in the workstation. The Error Boundary caught it safely without crashing your browser session.
                                </p>
                                <div className="bg-black/80 border border-red-900/60 rounded-xl p-4 text-left overflow-x-auto text-xs font-mono text-red-300 max-h-48">
                                    {this.state.error && this.state.error.toString()}
                                </div>
                                <button
                                    onClick={() => {
                                        this.setState({ hasError: false, error: null });
                                        if ("caches" in window) {
                                            caches.keys().then((names) => {
                                                names.forEach((name) => caches.delete(name));
                                            });
                                        }
                                        window.location.href = window.location.origin + window.location.pathname + "?v=" + Date.now();
                                    }}
                                    className="px-6 py-3 bg-red-600 hover:bg-red-500 text-white font-extrabold text-sm rounded-xl shadow-lg transition"
                                >
                                    🔄 Clear Cache &amp; Hard Reload Workstation
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        ReactDOM.createRoot(document.getElementById("__next")).render(
            <GlobalErrorBoundary>
                <OmniMashApp />
            </GlobalErrorBoundary>
        );
    </script>
</body>
</html>
