                                                </div>

                                                {/* Live Final Video Generation Prompt Inspector Widget */}
                                                <div className="bg-gray-900 border border-purple-900/50 rounded-xl p-3.5 space-y-2 pt-2">
                                                    <div className="flex items-center justify-between">
                                                        <label className="text-xs font-bold text-pink-300 uppercase tracking-wider flex items-center gap-2">
                                                            <span>📝</span>
                                                            <span>Final Video Generation Prompt (Live 4-Block Compiler)</span>
                                                        </label>
                                                        <span className="text-[10px] bg-purple-950 text-purple-300 px-2 py-0.5 rounded border border-purple-800 font-mono">
                                                            Live Payload Output
                                                        </span>
                                                    </div>
                                                    <textarea
                                                        rows={7}
                                                        value={card.compiled_override !== undefined ? card.compiled_override : compileJourney3ShotPromptPreview(card)}
                                                        onChange={(e) => {
                                                            const val = e.target.value;
                                                            setJ3ShotCards((prev) =>
                                                                prev.map((c) => (c.shot_index === card.shot_index ? { ...c, compiled_override: val } : c))
                                                            );
                                                        }}
                                                        className="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-[11px] font-mono text-purple-200 focus:outline-none focus:border-purple-500"
                                                    />
                                                </div>

                                                {/* STEP 3 WITHIN SHOT CARD OR SECTION */}
                                                <div className="pt-2 border-t border-gray-800/80 space-y-2">
                                                    {/* Cumulative State Inspector Badge/Box */}
                                                    <div className="bg-blue-950/40 border border-blue-800/60 rounded-lg p-2 text-xs">
                                                        <span className="font-bold text-blue-300 block">Cumulative State Inspector:</span>
                                                        <div className="flex flex-wrap gap-1 mt-1">
                                                            {card.cumulative_state && card.cumulative_state.length > 0 ? (
                                                                card.cumulative_state.map((st, sidx) => (
                                                                    <span key={sidx} className="bg-blue-900/60 text-blue-200 border border-blue-700 px-2 py-0.5 rounded text-[10px] font-mono">
                                                                        [Active State: {st}]
                                                                    </span>
                                                                ))
                                                            ) : (
                                                                <span className="text-[10px] text-gray-500 font-mono">[Active State: Initial scene state]</span>
                                                            )}
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center justify-between gap-2 pt-1">
                                                        <button
                                                            type="button"
                                                            disabled={j3ShotGeneratingMap[card.shot_index]}
                                                            onClick={() => handleJourney3GenerateShot(card)}
                                                            className="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold text-xs py-2 px-3 rounded-xl shadow flex items-center justify-center gap-1.5 disabled:opacity-50"
                                                        >
                                                            <span>🎬</span>
                                                            <span>{j3ShotGeneratingMap[card.shot_index] ? "Rendering..." : "🎬 Render 10s Shot Video"}</span>
                                                        </button>
                                                    </div>

                                                    {card.video_url && (
                                                        <div className="aspect-video bg-black rounded-lg overflow-hidden border border-gray-800 mt-2">
                                                            <video src={getDisplayableRefUrl(card.video_url)} controls className="w-full h-full object-contain" />
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* MODE 3 TURN HISTORY CAROUSEL & POST /api/diff CONTINUITY CONTROLS */}
                                <div className="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl space-y-4">
                                    <div className="flex flex-wrap items-center justify-between border-b border-gray-800 pb-3 gap-2">
                                        <h3 className="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                                            <span>🔄</span>
                                            <span>TurnHistoryCarousel — Mode 3 Turn History &amp; Branching</span>
                                        </h3>
                                        <span className="text-[10px] bg-amber-950 text-amber-300 px-2 py-0.5 rounded border border-amber-800 font-mono">
                                            Turn History
                                        </span>
                                    </div>

                                    {/* TurnHistoryCarousel Horizontal Scroll / Grid */}
                                    <div className="TurnHistoryCarousel space-y-2">
                                        <label className="text-xs font-bold text-gray-300 block">Turn History Visual Carousel:</label>
                                        <div className="flex items-center gap-4 overflow-x-auto pb-3 custom-scrollbar">
                                            {j3TurnHistory.map((turn, tIdx) => (
                                                <div
                                                    key={turn.turnId || tIdx}
                                                    className={`min-w-[220px] max-w-[240px] bg-gray-950 border rounded-xl p-3 flex flex-col justify-between space-y-2 transition ${
                                                        activeBranchTurnId === turn.turnId ? "border-amber-500 bg-amber-950/20 shadow-lg" : "border-gray-800 hover:border-gray-700"
                                                    }`}
                                                >
                                                    <div className="flex items-center justify-between text-[11px] font-mono">
                                                        <span className="font-bold text-amber-300">Turn {turn.turnNumber !== undefined ? turn.turnNumber : tIdx}</span>
                                                        <span className="text-gray-400 text-[10px]">{turn.turnId}</span>
                                                    </div>
                                                    <p className="text-xs text-gray-300 line-clamp-2">{turn.prompt || `Turn ${tIdx} scene diff`}</p>
                                                    <div className="aspect-video bg-black rounded-lg overflow-hidden border border-gray-800 relative">
                                                        {turn.videoUrl ? (
                                                            <video src={getDisplayableRefUrl(turn.videoUrl)} className="w-full h-full object-cover" />
                                                        ) : (
                                                            <div className="w-full h-full flex items-center justify-center text-[10px] text-gray-500 font-mono">No Video Preview</div>
                                                        )}
                                                        <a
                                                            href={getDisplayableRefUrl(turn.videoUrl || "#")}
                                                            target="_blank"
                                                            rel="noopener noreferrer"
                                                            className="absolute bottom-1 right-1 bg-black/80 hover:bg-black text-amber-300 text-[9px] font-mono px-1.5 py-0.5 rounded border border-amber-800/60"
                                                        >
                                                            Thumbnail Preview Link
                                                        </a>
                                                    </div>
                                                    <button
                                                        type="button"
                                                        onClick={() => setActiveBranchTurnId(turn.turnId)}
                                                        className={`w-full text-xs font-bold py-1.5 px-2 rounded-lg border transition flex items-center justify-center gap-1 ${
                                                            activeBranchTurnId === turn.turnId
                                                                ? "bg-amber-600 text-white border-amber-500 shadow"
                                                                : "bg-gray-900 hover:bg-gray-800 text-amber-300 border-amber-900/60"
                                                        }`}
                                                    >
                                                        <span>⏪</span>
                                                        <span>⏪ Branch from Turn {turn.turnNumber !== undefined ? turn.turnNumber : tIdx}</span>
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* POST /api/diff Controls & Keyframe Seed Lock Status Badge */}
                                    <div className="bg-gray-950 border border-gray-800 rounded-xl p-4 space-y-3">
                                        <div className="flex flex-wrap items-center justify-between gap-2 border-b border-gray-800/80 pb-2">
                                            <span className="text-xs font-bold text-purple-300">POST /api/diff Controls &amp; Visual Continuity Lock</span>
                                            
                                            {/* Status Badge showing active keyframe seed anchor */}
                                            <div className="flex items-center gap-2">
                                                <span className="text-xs font-bold px-2.5 py-1 rounded-lg border bg-purple-950/80 text-purple-200 border-purple-800 font-mono flex items-center gap-1.5">
                                                    <span>🔒</span>
                                                    <span>🔒 Anchored to Keyframe Seed:</span>
                                                    <span className="text-amber-300 font-extrabold">{"<FIRST_FRAME>@" + keyframeSeedAnchor}</span>
                                                </span>
                                                <button
                                                    type="button"
                                                    onClick={() => setIsVisualContinuityLocked(!isVisualContinuityLocked)}
                                                    className={`text-xs font-extrabold px-3 py-1 rounded-lg border transition flex items-center gap-1 ${
                                                        isVisualContinuityLocked
                                                            ? "bg-purple-900 hover:bg-purple-800 text-purple-200 border-purple-600 shadow"
                                                            : "bg-gray-900 hover:bg-gray-800 text-gray-400 border-gray-700"
                                                    }`}
                                                >
                                                    {isVisualContinuityLocked ? (
                                                        <>
                                                            <span>🔒</span>
                                                            <span>🔒 Lock Visual Continuity</span>
                                                        </>
                                                    ) : (
                                                        <>
                                                            <span>🔓</span>
                                                            <span>🔓 Fresh Keyframe</span>
                                                        </>
                                                    )}
                                                </button>
                                            </div>
                                        </div>

                                        <div className="space-y-2">
                                            <label className="text-xs font-bold text-gray-300 block">Diff Modification Prompt (POST /api/diff):</label>
                                            <div className="flex flex-col sm:flex-row gap-2">
                                                <input
                                                    type="text"
                                                    value={j3DiffPrompt}
                                                    onChange={(e) => setJ3DiffPrompt(e.target.value)}
                                                    placeholder="Describe scene modification diff from selected turn..."
                                                    className="flex-1 bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-purple-500 font-mono"
                                                />
                                                <button
                                                    type="button"
                                                    disabled={j3DiffLoading || !j3DiffPrompt.trim()}
                                                    onClick={handleJ3DiffSubmit}
                                                    className="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-xs py-2.5 px-5 rounded-xl shadow transition disabled:opacity-50 whitespace-nowrap flex items-center justify-center gap-1.5"
                                                >
                                                    <span>🎯</span>
                                                    <span>{j3DiffLoading ? "Applying Diff..." : "Apply Diff (POST /api/diff)"}</span>
                                                </button>
                                            </div>
                                            <div className="flex flex-wrap items-center gap-1.5 mt-1.5">
                                                <span className="text-[11px] text-gray-400 font-medium">⚡ Vision Prompt Diff Suggestions:</span>
                                                {[
                                                    "Make background darker with glowing blue neon",
                                                    "Add heavy 808 bass drop audio cue",
                                                    "Zoom camera in on character face with dramatic lighting",
                                                    "Add fog particles and purple rim lights"
                                                ].map((diffText, dIdx) => (
                                                    <button
                                                        key={dIdx}
                                                        type="button"
                                                        onClick={() => setJ3DiffPrompt(diffText)}
                                                        className="bg-blue-950/60 border border-blue-800/80 hover:border-blue-500 text-blue-200 text-[10px] px-2 py-0.5 rounded-md transition"
                                                    >
                                                        {diffText}
                                                    </button>
                                                ))}
                                            </div>
                                            <p className="text-[10px] text-gray-400">
                                                Active Branch Parent Turn: <span className="font-mono text-amber-300">{activeBranchTurnId || "turn_00"}</span> | Active Keyframe Seed Anchor: <span className="font-mono text-purple-300">{"<FIRST_FRAME>@" + keyframeSeedAnchor}</span>
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                {/* STEP 3: MASTER ASSEMBLY & STITCHING */}
                                <div className="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl space-y-4">
                                    <h3 className="text-xs font-bold text-pink-400 uppercase tracking-wider flex items-center gap-2">
                                        <span>🎬</span>
                                        <span>Step 3: Cumulative Scene State &amp; Master Assembly</span>
                                    </h3>

                                    <div className="bg-gray-950 border border-gray-800 rounded-xl p-4 space-y-3">
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-bold text-gray-300">Stitch All Generated Clips into Master Sequence</span>
                                            <span className="text-[10px] font-mono text-gray-400">Total Shots: {j3ShotCards.length}</span>
                                        </div>

                                        {j3MasterVideoUrl && (
                                            <div className="space-y-2">
                                                <span className="text-xs font-bold text-green-300 block">Stitched Master Preview:</span>
                                                <div className="aspect-video bg-black rounded-xl overflow-hidden border border-gray-800 max-w-2xl mx-auto">
                                                    <video src={getDisplayableRefUrl(j3MasterVideoUrl)} controls className="w-full h-full object-contain" />
                                                </div>
                                            </div>
                                        )}

                                        <div className="flex justify-end">
                                            <button
                                                type="button"
                                                disabled={j3StitchLoading}
                                                onClick={handleJourney3Stitch}
                                                className="bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 hover:from-pink-400 hover:to-indigo-500 text-white font-extrabold text-xs py-3 px-6 rounded-xl shadow-lg flex items-center gap-2 disabled:opacity-50"
                                            >
                                                <span>🎬</span>
                                                <span>{j3StitchLoading ? "Stitching Master Video..." : "🎬 Stitch Master Video"}</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Fullscreen Lightbox Modal */}
                        {lightboxImageUrl && (
                            <div
                                className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4"
                                onClick={() => setLightboxImageUrl(null)}
                            >
                                <div className="relative max-w-5xl max-h-[90vh] flex flex-col items-center justify-center" onClick={(e) => e.stopPropagation()}>
                                    <button
                                        type="button"
                                        onClick={() => setLightboxImageUrl(null)}
                                        className="absolute -top-10 right-0 text-white hover:text-red-400 text-sm font-bold bg-gray-900 border border-gray-700 px-3 py-1 rounded-full transition shadow-lg"
                                    >
                                        ✕ Close Fullscreen
                                    </button>
                                    <img
                                        src={lightboxImageUrl}
                                        alt="Enlarged Visual Preview"
                                        className="max-w-full max-h-[85vh] object-contain rounded-2xl border border-gray-700 shadow-2xl"
                                    />
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        class GlobalErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("UI Rendering Error Caught:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-gray-950 text-white p-8 flex flex-col items-center justify-center">
                            <div className="max-w-2xl w-full bg-gray-900 border border-red-800 rounded-3xl p-8 shadow-2xl space-y-6 text-center">
                                <span className="text-5xl block">⚠️</span>
                                <h1 className="text-2xl font-black text-red-400">UI Rendering Error Caught</h1>
                                <p className="text-sm text-gray-300">
                                    A rendering exception occurred in the workstation. The Error Boundary caught it safely without crashing your browser session.
                                </p>
                                <div className="bg-black/80 border border-red-900/60 rounded-xl p-4 text-left overflow-x-auto text-xs font-mono text-red-300 max-h-48">
                                    {this.state.error && this.state.error.toString()}
                                </div>
                                <button
                                    onClick={() => {
                                        this.setState({ hasError: false, error: null });
                                        if ("caches" in window) {
                                            caches.keys().then((names) => {
                                                names.forEach((name) => caches.delete(name));
                                            });
                                        }
                                        window.location.href = window.location.origin + window.location.pathname + "?v=" + Date.now();
                                    }}
                                    className="px-6 py-3 bg-red-600 hover:bg-red-500 text-white font-extrabold text-sm rounded-xl shadow-lg transition"
                                >
                                    🔄 Clear Cache &amp; Hard Reload Workstation
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        ReactDOM.createRoot(document.getElementById("__next")).render(
            <GlobalErrorBoundary>
                <OmniMashApp />
            </GlobalErrorBoundary>
        );
    </script>
</body>
</html>
